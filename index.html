<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Võlukeeled lendavad Sydneysse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--sea:#1b3040;--land:#e2d6bc;--orange:#ef6c33;--ink:#1d2a33;--muted:#6b7680;--bg:#f6f1e7;--card:#fffdf8;--line:#e6dccb}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 40px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{font-size:clamp(24px,4vw,38px);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);margin-top:6px;font-size:16px}
  .cta{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px;font-size:16px;box-shadow:0 6px 18px rgba(239,108,51,.3)}
  .cta:hover{filter:brightness(1.05)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .stat .k{font-size:13px;color:var(--muted);font-weight:500}
  .stat .v{font-size:clamp(22px,3.4vw,32px);font-weight:800;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .stat .v.o{color:var(--orange)}
  .stat .n{font-size:13px;color:var(--muted);margin-top:2px}
  .map{position:relative;border-radius:16px;overflow:hidden;background:var(--sea);box-shadow:0 10px 30px rgba(20,35,45,.18)}
  .map svg{display:block;width:100%;height:auto}
  .city text{font-family:Inter,sans-serif;font-weight:600;paint-order:stroke;stroke:#14232d;stroke-width:5px;stroke-linejoin:round}
  .bar{margin:18px 0 6px;position:relative;height:16px;background:#e9e0cf;border-radius:999px;overflow:visible}
  .bar .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#f39a5f,var(--orange));border-radius:999px;transition:width 2.4s cubic-bezier(.4,.1,.2,1)}
  .bar .mk{position:absolute;top:-6px;width:2px;height:28px;background:var(--ink);opacity:.35}
  .barlab{position:relative;height:40px;font-size:12.5px;color:var(--muted);font-weight:500}
  .barlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .barlab span.end{transform:translateX(-100%)}
  .stops{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:16px}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
  .stop b{display:block;font-size:15px}
  .stop .e{color:var(--muted);font-size:13px}
  .stop.done{border-color:#f3b896;background:#fff4ec}
  .stop.done b::before{content:"✓ ";color:var(--orange)}
  footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:13px}
  .linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:4px}
  .panel{display:none;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel.open{display:block}
  .panel h3{margin:0 0 10px;font-size:16px}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  label{font-size:13px;color:var(--muted);display:block}
  input{width:100%;margin-top:4px;padding:9px 10px;border:1px solid #d8ccb6;border-radius:9px;font:inherit;font-size:15px;background:#fff}
  .btn{margin-top:12px;background:var(--ink);color:#fff;border:none;border-radius:9px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  .msg{margin-left:10px;font-size:13px}
  @media (max-width:720px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.stops{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.barlab{font-size:11.5px;height:58px}.barlab span.end{top:36px}}
</style>
</head>

<script>
const GEO = {"cities": [{"name": "Tallinn", "eur": 0, "x": 351.4, "y": 118.2, "ret": false}, {"name": "Varssavi", "eur": 500, "x": 333.8, "y": 178.9, "ret": false}, {"name": "Istanbul", "eur": 2000, "x": 371.3, "y": 256.3, "ret": false}, {"name": "Dubai", "eur": 2400, "x": 495.2, "y": 345.7, "ret": false}, {"name": "Singapur", "eur": 5000, "x": 724.0, "y": 462.1, "ret": false}, {"name": "Sydney", "eur": 7500, "x": 947.3, "y": 638.3, "ret": false}, {"name": "Tagasilend", "eur": 10000, "x": 724.0, "y": 462.1, "ret": true}], "segs": ["M351.4 118.2Q331.7 145.4 333.8 178.9", "M333.8 178.9Q338.6 224.4 371.3 256.3", "M371.3 256.3Q417.2 323.3 495.2 345.7", "M495.2 345.7Q588.6 445.1 724.0 462.1", "M724.0 462.1Q803.9 590.4 947.3 638.3", "M947.3 638.3Q867.3 510.0 724.0 462.1"], "full": "M351.4 118.2Q331.7 145.4 333.8 178.9Q338.6 224.4 371.3 256.3Q417.2 323.3 495.2 345.7Q588.6 445.1 724.0 462.1Q803.9 590.4 947.3 638.3Q867.3 510.0 724.0 462.1"};
const S = JSON.parse(document.getElementById('state').textContent);
function parseTxt(t){ const o={}; t.split(/\r?\n/).forEach(l=>{ const m=l.match(/^\s*([^:#]+?)\s*:\s*(.*?)\s*$/); if(m) o[m[1].toLowerCase()]=m[2]; }); const num=v=>+String(v||'').replace(/[^0-9.,]/g,'').replace(',','.')||0;
  if('summa' in o) S.amount=num(o.summa); if('toetajaid' in o) S.backers=num(o.toetajaid); if('link' in o) S.link=o.link; if('uuendatud' in o) S.updated=o.uuendatud; }
const NS = 'http://www.w3.org/2000/svg';
const fmt = n => Math.round(n).toLocaleString('et-EE').replace(/ /g,' ');
const KM_PER_EUR = 2;

// route geometry
const segG = document.getElementById('segs');
const segEls = GEO.segs.map(d => { const p = document.createElementNS(NS,'path'); p.setAttribute('d', d); segG.appendChild(p); return p; });
const segLen = segEls.map(p => p.getTotalLength());
const cum = [0]; segLen.forEach(l => cum.push(cum[cum.length-1] + l));
const TOTAL = cum[cum.length-1];
document.getElementById('rest').setAttribute('d', GEO.full);
const done = document.getElementById('done'); done.setAttribute('d', GEO.full);

// cities
const cG = document.getElementById('cities');
const LAB = {Tallinn:[16,-14,'start'],Varssavi:[-14,6,'end'],Istanbul:[-14,10,'end'],Dubai:[14,22,'start'],Singapur:[14,24,'start'],Sydney:[18,26,'start']};
const cityDots = GEO.cities.map((c,i) => {
  const g = document.createElementNS(NS,'g'); g.setAttribute('class','city');
  const big = i===0 || c.name==='Sydney';
  const dot = document.createElementNS(NS,'circle');
  dot.setAttribute('cx',c.x); dot.setAttribute('cy',c.y); dot.setAttribute('r', big?10:8);
  dot.setAttribute('stroke','#14232d'); dot.setAttribute('stroke-width','2.5'); dot.setAttribute('fill','#fff');
  if (c.ret) { const d2=document.createElementNS(NS,'circle'); d2.setAttribute('cx',c.x); d2.setAttribute('cy',c.y); d2.setAttribute('r',0); g.appendChild(d2); cG.appendChild(g); return d2; }
  const t = document.createElementNS(NS,'text'); const [dx,dy,anc] = LAB[c.name];
  t.setAttribute('x', c.x+dx); t.setAttribute('y', c.y+dy); t.setAttribute('text-anchor', anc);
  t.setAttribute('font-size', big?28:22); t.setAttribute('fill','#fff'); t.textContent = c.name;
  g.append(dot,t);
  if (i>0) { const e = document.createElementNS(NS,'text'); e.setAttribute('x', c.x+dx); e.setAttribute('y', c.y+dy+(big?24:20)); e.setAttribute('text-anchor', anc); e.setAttribute('font-size', big?18:16); e.setAttribute('fill','#f6c9ad'); e.textContent = fmt(c.eur)+' €'; g.appendChild(e); }
  cG.appendChild(g); return dot;
});

function lenForEur(eur){
  const C = GEO.cities; if (eur <= 0) return 0; if (eur >= C[C.length-1].eur) return TOTAL;
  for (let i=0;i<C.length-1;i++) if (eur <= C[i+1].eur) return cum[i] + (eur-C[i].eur)/(C[i+1].eur-C[i].eur)*segLen[i];
  return TOTAL;
}
function pointAt(L){
  let i = 0; while (i < segLen.length-1 && L > cum[i+1]) i++;
  const local = Math.max(0, Math.min(segLen[i], L - cum[i]));
  const p = segEls[i].getPointAtLength(local);
  const q = segEls[i].getPointAtLength(Math.min(segLen[i], local + 1));
  const p0 = local + 1 > segLen[i] ? segEls[i].getPointAtLength(Math.max(0, local - 1)) : p;
  const ang = local + 1 > segLen[i] ? Math.atan2(p.y-p0.y, p.x-p0.x) : Math.atan2(q.y-p.y, q.x-p.x);
  return {x:p.x, y:p.y, ang};
}
const plane = document.getElementById('plane'), mapKm = document.getElementById('mapKm');
function draw(eur){
  const L = lenForEur(eur), pt = pointAt(Math.max(L, 0.5));
  done.setAttribute('stroke-dasharray', `${L} ${TOTAL+10}`);
  plane.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${pt.ang*180/Math.PI})`);
  mapKm.textContent = fmt(Math.min(eur, GEO.cities[GEO.cities.length-1].eur) * KM_PER_EUR) + ' km';
  const sing = GEO.cities.findIndex(c=>c.name==='Singapur'); if (sing>=0 && eur >= GEO.cities[GEO.cities.length-1].eur) cityDots[sing].setAttribute('stroke','#ef6c33');
  GEO.cities.forEach((c,i) => cityDots[i].setAttribute('fill', eur >= c.eur && (i>0 || eur>0) ? '#ef6c33' : '#fff'));
}

function render(){
  const eur = Math.max(0, +S.amount || 0), goal2 = S.goal2, goal1 = S.goal1, goal3 = S.goal3 || 10000;
  document.getElementById('sEur').textContent = fmt(eur) + ' €';
  document.getElementById('sBack').textContent = S.backers ? fmt(S.backers) + ' toetajat · eesmärk ' + fmt(goal1) + ' €' : 'Eesmärk ' + fmt(goal1) + ' €, lisaeesmärgid ' + fmt(goal2) + ' € ja ' + fmt(goal3) + ' €';
  document.getElementById('sKm').textContent = fmt(Math.min(eur, goal3) * KM_PER_EUR) + ' km';
  document.getElementById('sKmN').textContent = eur >= goal2 ? 'Sydney käes! Nüüd koduteel' : '15 000 km Sydneysse';
  const next = GEO.cities.find(c => c.eur > eur);
  if (next) { document.getElementById('sNext').textContent = next.name; document.getElementById('sNextN').textContent = 'veel ' + fmt(next.eur - eur) + ' € (' + fmt((next.eur-eur)*KM_PER_EUR) + ' km)'; }
  else { document.getElementById('sNext').textContent = 'Kõik etapid täis! 🎉'; document.getElementById('sNextN').textContent = eur > goal3 ? 'Eesmärk ületatud ' + fmt(eur-goal3) + ' € võrra. Aitäh!' : 'Aitäh kõigile!'; }
  const cta = document.getElementById('cta');
  if (S.link && /^https?:\/\//.test(S.link)) { cta.href = S.link; cta.style.display = ''; } else cta.style.display = 'none';
  document.getElementById('upd').textContent = S.updated ? 'Viimati uuendatud ' + S.updated : '';
  // bar
  const pct = Math.min(1, eur/goal3);
  const bar = document.getElementById('bar'), lab = document.getElementById('barlab');
  bar.querySelectorAll('.mk').forEach(m => m.remove()); lab.innerHTML = '';
  [[goal1,'1. etapp ' + fmt(goal1) + ' €'],[goal2,'2. etapp ' + fmt(goal2) + ' € · Sydney'],[goal3,'3. etapp ' + fmt(goal3) + ' €']].forEach(([v,t],k) => {
    const x = v/goal3*100;
    if (k<2){ const m = document.createElement('div'); m.className='mk'; m.style.left = x+'%'; bar.appendChild(m); }
    const s = document.createElement('span'); s.textContent = t; s.style.left = x+'%'; if (k===2) s.className='end'; if (k===1) s.style.top='18px'; lab.appendChild(s);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('fill').style.width = (pct*100)+'%'; }));
  // stops
  const st = document.getElementById('stops'); st.innerHTML = '';
  GEO.cities.slice(1).forEach(c => { const label = c.ret ? 'Tagasilend' : c.name; const d = document.createElement('div'); d.className = 'stop' + (eur >= c.eur ? ' done' : ''); d.innerHTML = `<b></b><span class="e"></span>`; d.querySelector('b').textContent = label; d.querySelector('.e').textContent = fmt(c.eur)+' € · '+fmt(c.eur*KM_PER_EUR)+' km'; st.appendChild(d); });
  // fly-in animation
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || eur <= 0) { draw(eur); return; }
  const t0 = performance.now(), D = 2600;
  (function step(now){ const t = Math.min(1,(now-t0)/D), e = t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; draw(eur*e); if (t<1) requestAnimationFrame(step); })(t0);
}
fetch('summa.txt?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{ if(t) parseTxt(t); }).catch(()=>{}).finally(render);

</script>
